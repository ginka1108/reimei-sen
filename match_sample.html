<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MATCH - 黎明戦</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Noto+Serif+JP:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #06020e;
      --gold: rgba(200,168,75,1);
      --gold-dim: rgba(200,168,75,0.35);
      --gold-faint: rgba(200,168,75,0.08);
      --text: #e8e0d0;
      --text-dim: rgba(232,224,208,0.5);
      --dawn: #e8713a;
      --dawn-dim: rgba(232,113,58,0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Serif JP', serif;
      min-height: 100vh;
      overflow-x: hidden;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    body.visible { opacity: 1; }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 50% 100%, rgba(232,113,58,0.07) 0%, transparent 70%),
        radial-gradient(ellipse 80% 50% at 50% 110%, rgba(200,168,75,0.04) 0%, transparent 60%);
      pointer-events: none; z-index: 0;
    }

    /* ── ヘッダ ── */
    header {
      position: fixed; top: 0; left: 0; right: 0; height: 56px;
      display: flex; align-items: center; padding: 0 24px;
      background: rgba(6,2,14,0.88); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--gold-dim); z-index: 100; gap: 16px;
    }
    .back-btn {
      color: var(--gold); text-decoration: none;
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px; letter-spacing: 0.1em; opacity: 0.8; transition: opacity 0.2s;
    }
    .back-btn:hover { opacity: 1; }
    .back-btn::before { content: '← '; }
    .header-logo { height: 28px; margin-left: auto; opacity: 0.9; }

    /* ── メイン ── */
    main {
      position: relative; z-index: 1;
      padding: 72px 20px 60px;
      max-width: 1200px; margin: 0 auto;
      display: flex; flex-direction: column;
      min-height: 100vh;
    }

    /* ── ページタイトル ── */
    .page-title { text-align: center; padding: 16px 0 20px; }
    .page-title h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(26px,4vw,44px); font-weight: 300;
      letter-spacing: 0.3em; color: var(--gold);
      text-shadow: 0 0 40px rgba(200,168,75,0.3);
    }
    .page-title .subtitle {
      font-size: 10px; letter-spacing: 0.35em;
      color: var(--text-dim); margin-top: 6px;
    }

    /* ── タブ ── */
    .tabs {
      display: flex; justify-content: center; gap: 0;
      margin-bottom: 20px;
    }
    .tab-btn {
      padding: 10px 36px; background: none;
      border: 1px solid var(--gold-dim); color: var(--text-dim);
      font-family: 'Noto Serif JP', serif; font-size: 12px;
      letter-spacing: 0.18em; cursor: pointer; transition: all 0.25s;
    }
    .tab-btn:first-child { border-radius: 2px 0 0 2px; }
    .tab-btn:last-child  { border-radius: 0 2px 2px 0; border-left: none; }
    .tab-btn.active {
      background: rgba(200,168,75,0.12); color: var(--gold);
      border-color: var(--gold); box-shadow: 0 0 12px rgba(200,168,75,0.15);
    }

    /* ── パネル ── */
    .panel { display: none; flex: 1; }
    .panel.active { display: flex; flex-direction: column; animation: fadeUp 0.35s ease; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ────────────────────────────────
       ① 対戦チームパネル
       4セル（天卓×1 + 元卓×1 → 各セルに2チームVS）
       2×2グリッド、16:9
    ──────────────────────────────── */
    .teams-panel-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 16px;
      flex: 1;
      aspect-ratio: 16 / 9;
      max-height: calc(100vh - 230px);
      width: 100%;
    }

    .court-cell {
      position: relative;
      border: 1px solid var(--gold-dim);
      border-radius: 4px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      overflow: hidden;
      background: var(--gold-faint);
    }
    .court-cell::before, .court-cell::after {
      content: ''; position: absolute;
      width: 10px; height: 10px;
      border-color: var(--gold-dim); border-style: solid;
      pointer-events: none;
    }
    .court-cell::before { top: 6px; left: 6px; border-width: 1px 0 0 1px; }
    .court-cell::after  { bottom: 6px; right: 6px; border-width: 0 1px 1px 0; }

    .court-badge {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px; letter-spacing: 0.3em; color: var(--gold-dim);
      white-space: nowrap;
    }

    .vs-row {
      display: flex; align-items: center;
      justify-content: center; gap: 16px;
      width: 100%; padding: 0 20px;
    }
    .team-block {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; gap: 10px;
    }
    .logo-ring {
      width: clamp(52px, 7vw, 88px);
      height: clamp(52px, 7vw, 88px);
      border-radius: 50%;
      border: 2px solid var(--gold-dim);
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      background: rgba(200,168,75,0.06);
      flex-shrink: 0;
    }
    .logo-ring img { width: 100%; height: 100%; object-fit: cover; }
    .logo-ring .logo-placeholder {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(18px, 3vw, 28px); color: var(--gold-dim);
    }
    .team-label {
      font-size: clamp(9px, 1.1vw, 12px);
      letter-spacing: 0.05em; text-align: center;
      color: var(--text); line-height: 1.4; max-width: 120px;
    }
    .vs-divider {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(18px, 3vw, 28px); font-weight: 300;
      color: var(--gold); text-shadow: 0 0 20px rgba(200,168,75,0.6);
      flex-shrink: 0;
    }

    /* ────────────────────────────────
       ② 対戦カードパネル
       2×2グリッド、各セルに2チーム×選手
    ──────────────────────────────── */
    .cards-panel-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 16px;
      flex: 1;
      aspect-ratio: 16 / 9;
      max-height: calc(100vh - 230px);
      width: 100%;
    }

    .card-court {
      position: relative;
      border: 1px solid var(--gold-dim);
      border-radius: 4px; overflow: hidden;
      display: flex; flex-direction: column;
      background: var(--gold-faint);
    }
    .card-court::before, .card-court::after {
      content: ''; position: absolute;
      width: 8px; height: 8px;
      border-color: var(--gold-dim); border-style: solid;
      z-index: 2; pointer-events: none;
    }
    .card-court::before { top: 6px; left: 6px; border-width: 1px 0 0 1px; }
    .card-court::after  { bottom: 6px; right: 6px; border-width: 0 1px 1px 0; }

    .card-header {
      display: flex; align-items: center; justify-content: center;
      padding: 6px 12px;
      border-bottom: 1px solid var(--gold-faint);
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px; letter-spacing: 0.3em; color: var(--gold-dim);
      background: rgba(200,168,75,0.04); flex-shrink: 0;
    }

    .card-body {
      flex: 1; display: grid;
      grid-template-columns: 1fr 1px 1fr;
      overflow: hidden; min-height: 0;
    }
    .card-divider-v { background: rgba(200,168,75,0.12); align-self: stretch; }

    .team-col {
      display: flex; flex-direction: column; min-height: 0;
    }
    .team-col-head {
      display: flex; align-items: center; gap: 7px;
      padding: 7px 10px;
      border-bottom: 1px solid var(--gold-faint); flex-shrink: 0;
    }
    .mini-logo {
      width: clamp(20px, 2.5vw, 28px);
      height: clamp(20px, 2.5vw, 28px);
      border-radius: 50%; border: 1px solid var(--gold-dim);
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      background: rgba(200,168,75,0.06); flex-shrink: 0;
    }
    .mini-logo img { width: 100%; height: 100%; object-fit: cover; }
    .mini-logo span { font-size: 9px; color: var(--gold-dim); }
    .col-team-name {
      font-size: clamp(8px, 1.1vw, 11px);
      letter-spacing: 0.04em; color: var(--text);
      line-height: 1.3; flex: 1; min-width: 0;
    }

    .player-list { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .player-item {
      flex: 1; display: flex; align-items: center;
      padding: 0 10px; gap: 7px;
      border-bottom: 1px solid rgba(200,168,75,0.05); min-height: 0;
    }
    .player-item:last-child { border-bottom: none; }
    .seat-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 10px; color: var(--gold-dim);
      min-width: 14px; text-align: right; flex-shrink: 0;
    }
    .seat-dot {
      width: 3px; height: 3px; border-radius: 50%;
      background: var(--gold-dim); flex-shrink: 0;
    }
    .player-name {
      font-size: clamp(9px, 1.2vw, 12px);
      letter-spacing: 0.04em; color: var(--text);
    }
    .player-name.undecided {
      color: var(--text-dim); font-style: italic; letter-spacing: 0.12em;
    }

    /* ── ローディング/エラー ── */
    .loading {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px; padding: 60px 0;
      color: var(--text-dim); font-size: 12px; letter-spacing: 0.2em;
      grid-column: 1 / -1;
    }
    .loading-ring {
      width: 32px; height: 32px;
      border: 1px solid var(--gold-dim); border-top-color: var(--gold);
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-msg {
      text-align: center; padding: 60px 0;
      color: var(--dawn); font-size: 12px; letter-spacing: 0.15em;
      grid-column: 1 / -1;
    }

    /* ── 下部装飾ライン ── */
    .bottom-line {
      position: fixed; bottom: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg,
        transparent 0%, var(--dawn-dim) 20%, var(--dawn) 50%,
        var(--dawn-dim) 80%, transparent 100%);
      z-index: 100;
    }

    /* ── レスポンシブ ── */
    @media (max-width: 680px) {
      .teams-panel-grid, .cards-panel-grid {
        grid-template-columns: 1fr; grid-template-rows: auto;
        aspect-ratio: auto; max-height: none; gap: 12px;
      }
      .court-cell { min-height: 140px; }
      .card-court { min-height: 160px; }
      .tab-btn { padding: 10px 20px; font-size: 11px; }
    }
  </style>
</head>
<body>

  <header>
    <a class="back-btn" href="index.html">トップへ</a>
    <img class="header-logo" src="assets/images/文字のみ.png" alt="黎明戦" onerror="this.style.display='none'">
  </header>

  <main>
    <div class="page-title">
      <h1>MATCH</h1>
      <p class="subtitle">次節対戦情報</p>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="panel-teams">対戦チーム</button>
      <button class="tab-btn"        data-tab="panel-cards">対戦カード</button>
    </div>

    <!-- ① 対戦チーム -->
    <div id="panel-teams" class="panel active">
      <div class="teams-panel-grid" id="teams-grid">
        <div class="loading"><div class="loading-ring"></div><span>LOADING</span></div>
      </div>
    </div>

    <!-- ② 対戦カード -->
    <div id="panel-cards" class="panel">
      <div class="cards-panel-grid" id="cards-grid">
        <div class="loading"><div class="loading-ring"></div><span>LOADING</span></div>
      </div>
    </div>
  </main>

  <div class="bottom-line"></div>

  <script>
  // ────────────────────────────────────────────────
  // タブ
  // ────────────────────────────────────────────────
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.tab).classList.add('active');
    });
  });

  // ────────────────────────────────────────────────
  // ユーティリティ
  // ────────────────────────────────────────────────
  function normalizeColor(c) {
    if (!c) return '#888888';
    c = String(c).trim();
    return c.startsWith('#') ? c : '#' + c;
  }
  function hexToRgb(hex) {
    const h = hex.replace('#','');
    return { r: parseInt(h.slice(0,2),16), g: parseInt(h.slice(2,4),16), b: parseInt(h.slice(4,6),16) };
  }
  function neonBg(hex, a=0.10) {
    const {r,g,b} = hexToRgb(hex);
    return `rgba(${r},${g},${b},${a})`;
  }
  function neonGlow(hex) {
    const {r,g,b} = hexToRgb(hex);
    return `0 0 16px rgba(${r},${g},${b},0.5), 0 0 4px rgba(${r},${g},${b},0.8)`;
  }

  // position のサフィックス数字 → 卓番号
  function courtNum(pos) { return parseInt(pos.replace(/\D/g,'')) || 1; }

  // ────────────────────────────────────────────────
  // データ取得
  // ────────────────────────────────────────────────
  async function loadData() {
    try {
      const [cardRes, teamRes] = await Promise.all([
        fetch('data/next_card.json'),
        fetch('data/team.json')
      ]);
      const cards = await cardRes.json();
      const teams = await teamRes.json();

      const teamMap = {};
      teams.forEach(t => {
        teamMap[t.name] = { image_url: t.image_url || null, color: normalizeColor(t.color) };
      });

      // 卓ごとに整理
      const courtData = {};
      cards.forEach(c => {
        const n = courtNum(c.position);
        if (!courtData[n]) courtData[n] = { label: c.cardname || `${n}卓`, entries: [] };
        courtData[n].entries.push(c);
      });

      renderTeamsPanel(courtData, teamMap);
      renderCardsPanel(courtData, teamMap);
    } catch(e) {
      console.error(e);
      ['teams-grid','cards-grid'].forEach(id => {
        document.getElementById(id).innerHTML =
          '<div class="error-msg">データの読み込みに失敗しました</div>';
      });
    }
  }

  // ────────────────────────────────────────────────
  // ① 対戦チームパネル
  // ────────────────────────────────────────────────
  function renderTeamsPanel(courtData, teamMap) {
    const grid = document.getElementById('teams-grid');
    grid.innerHTML = '';

    Object.values(courtData).forEach((court, ci) => {
      // 登場チームをユニーク化（出現順）
      const seenTeams = [];
      court.entries.forEach(e => { if (!seenTeams.includes(e.team)) seenTeams.push(e.team); });

      const cell = document.createElement('div');
      cell.className = 'court-cell';
      cell.style.animation = `fadeUp 0.45s ease ${ci * 0.1}s both`;

      const badge = document.createElement('div');
      badge.className = 'court-badge';
      badge.textContent = court.label;
      cell.appendChild(badge);

      const vsRow = document.createElement('div');
      vsRow.className = 'vs-row';

      seenTeams.forEach((tName, ti) => {
        const info = teamMap[tName] || {};
        const color = info.color || '#888888';

        const block = document.createElement('div');
        block.className = 'team-block';

        const ring = document.createElement('div');
        ring.className = 'logo-ring';
        ring.style.borderColor = color;
        ring.style.boxShadow = neonGlow(color);
        ring.style.background = neonBg(color, 0.15);

        if (info.image_url) {
          const img = document.createElement('img');
          img.src = info.image_url; img.alt = tName; img.loading = 'lazy';
          ring.appendChild(img);
        } else {
          const ph = document.createElement('span');
          ph.className = 'logo-placeholder'; ph.textContent = tName.charAt(0);
          ring.appendChild(ph);
        }

        const label = document.createElement('div');
        label.className = 'team-label'; label.textContent = tName;

        block.appendChild(ring); block.appendChild(label);
        vsRow.appendChild(block);

        if (ti < seenTeams.length - 1) {
          const vs = document.createElement('div');
          vs.className = 'vs-divider'; vs.textContent = 'VS';
          vsRow.appendChild(vs);
        }
      });

      cell.appendChild(vsRow);
      grid.appendChild(cell);
    });
  }

  // ────────────────────────────────────────────────
  // ② 対戦カードパネル
  // ────────────────────────────────────────────────
  function renderCardsPanel(courtData, teamMap) {
    const grid = document.getElementById('cards-grid');
    grid.innerHTML = '';

    Object.values(courtData).forEach((court, ci) => {
      // チームごとにエントリを集約（出現順）
      const teamEntries = {};
      const teamOrder = [];
      court.entries.forEach(e => {
        if (!teamEntries[e.team]) { teamEntries[e.team] = []; teamOrder.push(e.team); }
        teamEntries[e.team].push(e);
      });

      const courtEl = document.createElement('div');
      courtEl.className = 'card-court';
      courtEl.style.animation = `fadeUp 0.45s ease ${ci * 0.1}s both`;

      const hdr = document.createElement('div');
      hdr.className = 'card-header'; hdr.textContent = court.label;
      courtEl.appendChild(hdr);

      const body = document.createElement('div');
      body.className = 'card-body';

      teamOrder.slice(0, 2).forEach((tName, ti) => {
        if (ti === 1) {
          const dvd = document.createElement('div');
          dvd.className = 'card-divider-v'; body.appendChild(dvd);
        }

        const info = teamMap[tName] || {};
        const color = info.color || '#888888';
        const entries = teamEntries[tName];

        const col = document.createElement('div');
        col.className = 'team-col';
        col.style.background = neonBg(color, 0.07);

        const colHead = document.createElement('div');
        colHead.className = 'team-col-head';
        colHead.style.borderBottomColor = neonBg(color, 0.4);

        const miniLogo = document.createElement('div');
        miniLogo.className = 'mini-logo';
        miniLogo.style.borderColor = color;
        miniLogo.style.boxShadow = neonGlow(color);

        if (info.image_url) {
          const img = document.createElement('img');
          img.src = info.image_url; img.alt = tName;
          miniLogo.appendChild(img);
        } else {
          const sp = document.createElement('span'); sp.textContent = tName.charAt(0);
          miniLogo.appendChild(sp);
        }

        const colName = document.createElement('div');
        colName.className = 'col-team-name'; colName.textContent = tName;

        colHead.appendChild(miniLogo); colHead.appendChild(colName);
        col.appendChild(colHead);

        const pList = document.createElement('div');
        pList.className = 'player-list';

        entries.forEach((e, pi) => {
          const item = document.createElement('div');
          item.className = 'player-item';

          const num = document.createElement('div');
          num.className = 'seat-num'; num.textContent = pi + 1;

          const dot = document.createElement('div');
          dot.className = 'seat-dot'; dot.style.background = color;

          const pName = (e.player || '').trim();
          const isUndecided = !pName || pName === '未定' || pName === '-';
          const name = document.createElement('div');
          name.className = 'player-name' + (isUndecided ? ' undecided' : '');
          name.textContent = isUndecided ? '未定' : pName;

          item.appendChild(num); item.appendChild(dot); item.appendChild(name);
          pList.appendChild(item);
        });

        col.appendChild(pList);
        body.appendChild(col);
      });

      courtEl.appendChild(body);
      grid.appendChild(courtEl);
    });
  }

  // ────────────────────────────────────────────────
  // 初期化
  // ────────────────────────────────────────────────
  window.addEventListener('pageshow', () => document.body.classList.add('visible'));
  loadData();
  </script>
</body>
</html>
