<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MATCH - 黎明戦</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Noto+Serif+JP:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #06020e;
      --gold: rgba(200,168,75,1);
      --gold-dim: rgba(200,168,75,0.35);
      --gold-faint: rgba(200,168,75,0.08);
      --text: #e8e0d0;
      --text-dim: rgba(232,224,208,0.5);
      --dawn: #e8713a;
      --dawn-dim: rgba(232,113,58,0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Serif JP', serif;
      min-height: 100vh;
      overflow-x: hidden;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    body.visible { opacity: 1; }
    body::before {
      content: ''; position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 50% 100%, rgba(232,113,58,0.07) 0%, transparent 70%),
        radial-gradient(ellipse 80% 50% at 50% 110%, rgba(200,168,75,0.04) 0%, transparent 60%);
      pointer-events: none; z-index: 0;
    }

    /* ── ヘッダ ── */
    header {
      position: fixed; top: 0; left: 0; right: 0; height: 56px;
      display: flex; align-items: center; padding: 0 24px;
      background: rgba(6,2,14,0.88); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--gold-dim); z-index: 100; gap: 16px;
    }
    .back-btn {
      color: var(--gold); text-decoration: none;
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px; letter-spacing: 0.1em; opacity: 0.8; transition: opacity 0.2s;
    }
    .back-btn:hover { opacity: 1; }
    .back-btn::before { content: '← '; }
    .header-logo { height: 28px; margin-left: auto; opacity: 0.9; }

    /* ── メイン ── */
    main {
      position: relative; z-index: 1;
      padding: 68px 16px 56px;
      max-width: 1200px; margin: 0 auto;
      display: flex; flex-direction: column;
      gap: 16px;
    }

    /* ── タブ ── */
    .tabs {
      display: flex; justify-content: center; gap: 0;
      padding-top: 8px;
    }
    .tab-btn {
      padding: 9px 32px; background: none;
      border: 1px solid var(--gold-dim); color: var(--text-dim);
      font-family: 'Noto Serif JP', serif; font-size: 12px;
      letter-spacing: 0.18em; cursor: pointer; transition: all 0.25s;
    }
    .tab-btn:first-child { border-radius: 2px 0 0 2px; }
    .tab-btn:last-child  { border-radius: 0 2px 2px 0; border-left: none; }
    .tab-btn.active {
      background: rgba(200,168,75,0.12); color: var(--gold);
      border-color: var(--gold); box-shadow: 0 0 12px rgba(200,168,75,0.15);
    }

    /* ── パネル共通 ── */
    .panel { display: none; }
    .panel.active { display: block; animation: fadeUp 0.35s ease; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ════════════════════════════════════════
       メタ情報バー（両タブ共通）
       ════════════════════════════════════════ */
    .meta-bar {
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      border: 1px solid var(--gold-dim);
      border-radius: 3px;
      background: rgba(200,168,75,0.04);
      gap: 16px;
      flex-wrap: wrap;
    }
    .meta-logo {
      height: 32px; opacity: 0.85;
    }
    .meta-center {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    .meta-date {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(15px, 2.5vw, 20px); letter-spacing: 0.15em; color: var(--text);
    }
    .meta-right {
      text-align: right;
    }
    .meta-section-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(16px, 2.5vw, 22px); letter-spacing: 0.15em; color: var(--gold);
      white-space: nowrap;
    }
    .meta-section-sub {
      font-size: 11px; letter-spacing: 0.2em; color: var(--text-dim);
      margin-top: 2px;
    }
    /* 日付フォーマット中の曜日 */
    .meta-day { color: var(--text-dim); font-size: 0.85em; }

    /* ════════════════════════════════════════
       ① 対戦チームパネル
       左：天卓 2×2 / 右：元卓 2×2
       ════════════════════════════════════════ */
    .courts-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      /* 16:9 に収める */
      aspect-ratio: 16 / 9;
      max-height: calc(100vh - 220px);
    }

    .court-block {
      position: relative;
      display: flex; flex-direction: column;
      border: 1px solid var(--gold-dim);
      border-radius: 4px;
      overflow: hidden;
      background: rgba(200,168,75,0.03);
      padding: 10px 10px 0;
      gap: 8px;
    }
    /* コーナーデコ */
    .court-block::before, .court-block::after {
      content: ''; position: absolute; pointer-events: none;
      width: 12px; height: 12px;
      border-color: var(--gold-dim); border-style: solid;
    }
    .court-block::before { top: 5px; left: 5px; border-width: 1px 0 0 1px; }
    .court-block::after  { bottom: 5px; right: 5px; border-width: 0 1px 1px 0; }

    .court-label-row {
      display: flex; align-items: center; gap: 8px;
      flex-shrink: 0;
    }
    .court-label-dot {
      width: 8px; height: 8px;
      background: var(--gold); border-radius: 0;
      flex-shrink: 0;
    }
    .court-label-text {
      font-family: 'Noto Serif JP', serif;
      font-size: clamp(10px, 1.4vw, 13px); letter-spacing: 0.2em; color: var(--text-dim);
    }

    /* 2×2 ロゴグリッド */
    .logo-grid-2x2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 6px;
      flex: 1;
      min-height: 0;
    }

    .logo-cell {
      position: relative;
      border: 1px solid var(--gold-dim);
      border-radius: 3px;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.3);
      transition: border-color 0.25s;
    }
    .logo-cell:hover { border-color: var(--gold); }
    .logo-cell img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .logo-cell .logo-fallback {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(13px, 2vw, 20px);
      color: var(--gold-dim); letter-spacing: 0.05em;
      text-align: center; padding: 4px;
      line-height: 1.3;
    }

    /* 天/元 大文字ウォーターマーク */
    .court-kanji {
      position: absolute;
      bottom: -8px; left: 50%; transform: translateX(-50%);
      font-family: 'Noto Serif JP', serif;
      font-size: clamp(48px, 9vw, 110px);
      font-weight: 400;
      color: rgba(232,224,208,0.04);
      pointer-events: none;
      white-space: nowrap;
      line-height: 1;
      z-index: 0;
    }

    /* ════════════════════════════════════════
       ② 対戦カードパネル
       左：天卓 / 右：元卓
       各カードにロゴ＋選手名2名（2段）
       ════════════════════════════════════════ */
    .cards-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      aspect-ratio: 16 / 9;
      max-height: calc(100vh - 220px);
    }

    .card-block {
      position: relative;
      display: flex; flex-direction: column;
      border: 1px solid var(--gold-dim);
      border-radius: 4px;
      overflow: hidden;
      background: rgba(200,168,75,0.03);
      padding: 10px 10px 0;
      gap: 8px;
    }
    .card-block::before, .card-block::after {
      content: ''; position: absolute; pointer-events: none;
      width: 12px; height: 12px;
      border-color: var(--gold-dim); border-style: solid;
    }
    .card-block::before { top: 5px; left: 5px; border-width: 1px 0 0 1px; }
    .card-block::after  { bottom: 5px; right: 5px; border-width: 0 1px 1px 0; }

    /* 対戦カードのチーム行：2列（各チームが1列） */
    .card-grid-2x2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 6px;
      flex: 1; min-height: 0;
    }

    /* 1カード = ロゴ＋選手名の2段構成 */
    .player-card {
      position: relative;
      border: 1px solid var(--gold-dim);
      border-radius: 3px;
      overflow: hidden;
      display: flex; flex-direction: column;
      background: rgba(0,0,0,0.3);
      transition: border-color 0.25s;
    }
    /* チームカラー帯（JS で style 付与） */
    .player-card-color-bar {
      position: absolute; top: 0; left: 0; right: 0; height: 2px;
    }

    .player-card-logo {
      flex: 1; min-height: 0;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .player-card-logo img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .player-card-logo .logo-fallback {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(11px, 1.8vw, 18px);
      color: var(--gold-dim); text-align: center; padding: 4px;
      line-height: 1.3;
    }

    /* 選手名エリア */
    .player-card-name {
      flex-shrink: 0;
      padding: clamp(3px, 0.8vw, 7px) clamp(4px, 1vw, 10px);
      border-top: 1px solid rgba(200,168,75,0.12);
      background: rgba(6,2,14,0.7);
      display: flex; align-items: center; gap: 6px;
    }
    .player-name-dot {
      width: 3px; height: 3px; border-radius: 50%;
      flex-shrink: 0;
      /* チームカラーをJS付与 */
    }
    .player-name-text {
      font-size: clamp(9px, 1.3vw, 13px);
      letter-spacing: 0.05em; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .player-name-text.undecided {
      color: var(--text-dim); font-style: italic; letter-spacing: 0.12em;
      font-family: 'Cormorant Garamond', serif; font-size: clamp(9px, 1.2vw, 12px);
    }

    /* 天/元 ウォーターマーク */
    .card-kanji {
      position: absolute;
      bottom: -8px; left: 50%; transform: translateX(-50%);
      font-family: 'Noto Serif JP', serif;
      font-size: clamp(48px, 9vw, 110px); font-weight: 400;
      color: rgba(232,224,208,0.04);
      pointer-events: none; white-space: nowrap; line-height: 1; z-index: 0;
    }

    /* ── ローディング/エラー ── */
    .loading {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px; padding: 80px 0;
      color: var(--text-dim); font-size: 12px; letter-spacing: 0.2em;
    }
    .loading-ring {
      width: 32px; height: 32px;
      border: 1px solid var(--gold-dim); border-top-color: var(--gold);
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-msg {
      text-align: center; padding: 60px 0;
      color: var(--dawn); font-size: 12px; letter-spacing: 0.15em;
    }

    /* ── 下部装飾ライン ── */
    .bottom-line {
      position: fixed; bottom: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg,
        transparent 0%, var(--dawn-dim) 20%, var(--dawn) 50%,
        var(--dawn-dim) 80%, transparent 100%);
      z-index: 100;
    }

    /* ── レスポンシブ ── */
    @media (max-width: 640px) {
      .courts-layout, .cards-layout {
        grid-template-columns: 1fr;
        aspect-ratio: auto; max-height: none; gap: 10px;
      }
      .court-block, .card-block { padding: 8px 8px 0; min-height: 240px; }
      .tab-btn { padding: 9px 16px; font-size: 11px; }
    }
  </style>
</head>
<body>

  <header>
    <a class="back-btn" href="index.html">トップへ</a>
    <img class="header-logo" src="assets/images/文字のみ.png" alt="黎明戦" onerror="this.style.display='none'">
  </header>

  <main>
    <div class="tabs">
      <button class="tab-btn active" data-tab="panel-teams">対戦チーム</button>
      <button class="tab-btn"        data-tab="panel-cards">対戦カード</button>
    </div>

    <!-- メタ情報バー（両パネルに各1つ） -->

    <!-- ① 対戦チームパネル -->
    <div id="panel-teams" class="panel active">
      <div class="meta-bar" id="meta-teams">
        <img class="meta-logo" src="assets/images/文字のみ.png" alt="黎明戦" onerror="this.style.display='none'">
        <div class="meta-center">
          <div class="meta-date" id="meta-date-teams">―</div>
        </div>
        <div class="meta-right">
          <div class="meta-section-name" id="meta-section-teams">―</div>
          <div class="meta-section-sub" id="meta-sub-teams">卓組表</div>
        </div>
      </div>
      <div class="courts-layout" id="courts-container">
        <div class="loading" style="grid-column:1/-1"><div class="loading-ring"></div><span>LOADING</span></div>
      </div>
    </div>

    <!-- ② 対戦カードパネル -->
    <div id="panel-cards" class="panel">
      <div class="meta-bar" id="meta-cards">
        <img class="meta-logo" src="assets/images/文字のみ.png" alt="黎明戦" onerror="this.style.display='none'">
        <div class="meta-center">
          <div class="meta-date" id="meta-date-cards">―</div>
        </div>
        <div class="meta-right">
          <div class="meta-section-name" id="meta-section-cards">―</div>
          <div class="meta-section-sub" id="meta-sub-cards">対戦カード</div>
        </div>
      </div>
      <div class="cards-layout" id="cards-container">
        <div class="loading" style="grid-column:1/-1"><div class="loading-ring"></div><span>LOADING</span></div>
      </div>
    </div>
  </main>

  <div class="bottom-line"></div>

  <script>
  // ─────────────────────────────────────────────────
  // タブ切り替え
  // ─────────────────────────────────────────────────
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.tab).classList.add('active');
    });
  });

  // ─────────────────────────────────────────────────
  // ユーティリティ
  // ─────────────────────────────────────────────────
  function normalizeColor(c) {
    if (!c) return '#888888';
    c = String(c).trim();
    return c.startsWith('#') ? c : '#' + c;
  }
  function hexToRgb(hex) {
    const h = hex.replace('#','');
    return { r:parseInt(h.slice(0,2),16), g:parseInt(h.slice(2,4),16), b:parseInt(h.slice(4,6),16) };
  }
  function neonGlow(hex, a=0.55) {
    const {r,g,b} = hexToRgb(hex);
    return `0 0 14px rgba(${r},${g},${b},${a}), 0 0 3px rgba(${r},${g},${b},0.9)`;
  }

  // "5/26" → 今年のDateオブジェクト
  function parseScheduleDate(str) {
    const [m, d] = String(str).split('/').map(Number);
    const now = new Date();
    let year = now.getFullYear();
    // 月が今月より小さければ来年扱い（年末跨ぎ対応）
    if (m < now.getMonth() + 1) year++;
    return new Date(year, m - 1, d);
  }

  // 日付→表示文字列 "05月26日（月）"
  const WEEKDAYS = ['日','月','火','水','木','金','土'];
  function formatDate(d) {
    const m = String(d.getMonth()+1).padStart(2,'0');
    const dd = String(d.getDate()).padStart(2,'0');
    const w = WEEKDAYS[d.getDay()];
    return `${m}月${dd}日（${w}）`;
  }

  // position サフィックス数字 → 卓番号
  function courtNum(pos) { return parseInt(String(pos).replace(/\D/g,'')) || 1; }

  // ─────────────────────────────────────────────────
  // schedule.json から次節を取得
  // ─────────────────────────────────────────────────
  function findNextSchedule(scheduleData) {
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    // 今日以降で最も近い行
    const upcoming = scheduleData
      .map(row => ({ ...row, _date: parseScheduleDate(row.date) }))
      .filter(row => row._date >= today)
      .sort((a, b) => a._date - b._date);

    return upcoming[0] || null;
  }

  // ─────────────────────────────────────────────────
  // データ取得
  // ─────────────────────────────────────────────────
  async function loadData() {
    try {
      const [cardRes, teamRes, schedRes] = await Promise.all([
        fetch('data/next_card.json'),
        fetch('data/team.json'),
        fetch('data/schedule.json')
      ]);
      const cards    = await cardRes.json();
      const teams    = await teamRes.json();
      const schedule = await schedRes.json();

      // teamMap: name → {image_url, color}
      const teamMap = {};
      teams.forEach(t => {
        teamMap[t.name] = { image_url: t.image_url || null, color: normalizeColor(t.color) };
      });

      // 次節情報
      const nextSched = findNextSchedule(schedule);

      // メタバー更新（両タブ）
      if (nextSched) {
        const dateStr = formatDate(nextSched._date);
        const secName = nextSched.section || '';
        // "雪20節" → 何節/20節 を schedule 全体の長さから算出
        const totalSections = schedule.length;
        const currentIdx = schedule.findIndex(r => r.section === secName);
        const secNum = currentIdx >= 0 ? currentIdx + 1 : '?';

        ['teams','cards'].forEach(suffix => {
          document.getElementById(`meta-date-${suffix}`).textContent = dateStr;
          document.getElementById(`meta-section-${suffix}`).textContent = `${secName}　卓組表`;
          document.getElementById(`meta-sub-${suffix}`).textContent =
            `${secNum} / ${totalSections} 節`;
        });
      }

      // 卓ごとに整理
      const courtData = {};
      cards.forEach(c => {
        const n = courtNum(c.position);
        if (!courtData[n]) courtData[n] = { label: c.cardname || `${n}卓`, entries: [] };
        courtData[n].entries.push(c);
      });

      renderTeamsPanel(courtData, teamMap);
      renderCardsPanel(courtData, teamMap);

    } catch(e) {
      console.error(e);
      ['courts-container','cards-container'].forEach(id => {
        document.getElementById(id).innerHTML =
          '<div class="error-msg" style="grid-column:1/-1">データの読み込みに失敗しました</div>';
      });
    }
  }

  // ─────────────────────────────────────────────────
  // ① 対戦チームパネル
  // 卓ごとにブロック、2×2グリッドでチームロゴ
  // ─────────────────────────────────────────────────
  const COURT_KANJI = { 1: '天', 2: '元', 3: '地', 4: '人' };
  const COURT_LABEL = { 1: '天卓', 2: '元卓', 3: '地卓', 4: '人卓' };

  function renderTeamsPanel(courtData, teamMap) {
    const container = document.getElementById('courts-container');
    container.innerHTML = '';

    Object.entries(courtData).forEach(([numStr, court], ci) => {
      const n = parseInt(numStr);
      const block = document.createElement('div');
      block.className = 'court-block';
      block.style.animation = `fadeUp 0.4s ease ${ci * 0.08}s both`;

      // ラベル行
      const labelRow = document.createElement('div');
      labelRow.className = 'court-label-row';
      labelRow.innerHTML = `
        <div class="court-label-dot"></div>
        <div class="court-label-text">${court.label || COURT_LABEL[n] || `${n}卓`}</div>
      `;
      block.appendChild(labelRow);

      // 2×2ロゴグリッド
      const grid = document.createElement('div');
      grid.className = 'logo-grid-2x2';

      // position の方角でグリッド順序を固定（upleft→upright→bottomleft→bottomright）
      const ORDER = ['upleft','upright','bottomleft','bottomright'];
      const sorted = ORDER.map(dir => court.entries.find(e => e.position.replace(/\d/g,'') === dir))
                          .filter(Boolean);
      // 足りない場合は出現順を補完
      if (sorted.length < court.entries.length) {
        court.entries.forEach(e => { if (!sorted.includes(e)) sorted.push(e); });
      }

      sorted.forEach(entry => {
        const info = teamMap[entry.team] || {};
        const color = info.color || '#888888';
        const cell = document.createElement('div');
        cell.className = 'logo-cell';
        cell.style.borderColor = color + '88';
        cell.style.boxShadow = `inset 0 0 20px rgba(0,0,0,0.5)`;

        if (info.image_url) {
          const img = document.createElement('img');
          img.src = info.image_url; img.alt = entry.team; img.loading = 'lazy';
          cell.appendChild(img);
        } else {
          const fb = document.createElement('div');
          fb.className = 'logo-fallback'; fb.textContent = entry.team;
          cell.appendChild(fb);
        }
        grid.appendChild(cell);
      });

      block.appendChild(grid);

      // ウォーターマーク
      const kanji = document.createElement('div');
      kanji.className = 'court-kanji';
      kanji.textContent = COURT_KANJI[n] || '';
      block.appendChild(kanji);

      container.appendChild(block);
    });
  }

  // ─────────────────────────────────────────────────
  // ② 対戦カードパネル
  // 卓ごとにブロック、2×2グリッドで「ロゴ＋選手名」の2段カード
  // ─────────────────────────────────────────────────
  function renderCardsPanel(courtData, teamMap) {
    const container = document.getElementById('cards-container');
    container.innerHTML = '';

    Object.entries(courtData).forEach(([numStr, court], ci) => {
      const n = parseInt(numStr);
      const block = document.createElement('div');
      block.className = 'card-block';
      block.style.animation = `fadeUp 0.4s ease ${ci * 0.08}s both`;

      // ラベル行
      const labelRow = document.createElement('div');
      labelRow.className = 'court-label-row';
      labelRow.innerHTML = `
        <div class="court-label-dot"></div>
        <div class="court-label-text">${court.label || COURT_LABEL[n] || `${n}卓`}</div>
      `;
      block.appendChild(labelRow);

      // 2×2グリッド
      const grid = document.createElement('div');
      grid.className = 'card-grid-2x2';

      const ORDER = ['upleft','upright','bottomleft','bottomright'];
      const sorted = ORDER.map(dir => court.entries.find(e => e.position.replace(/\d/g,'') === dir))
                          .filter(Boolean);
      if (sorted.length < court.entries.length) {
        court.entries.forEach(e => { if (!sorted.includes(e)) sorted.push(e); });
      }

      sorted.forEach(entry => {
        const info = teamMap[entry.team] || {};
        const color = info.color || '#888888';
        const {r,g,b} = hexToRgb(color);

        const card = document.createElement('div');
        card.className = 'player-card';

        // チームカラー帯
        const bar = document.createElement('div');
        bar.className = 'player-card-color-bar';
        bar.style.background = `linear-gradient(90deg, rgba(${r},${g},${b},0.9), rgba(${r},${g},${b},0.2))`;
        card.appendChild(bar);

        // ロゴ部分
        const logoArea = document.createElement('div');
        logoArea.className = 'player-card-logo';
        logoArea.style.borderBottom = `1px solid rgba(${r},${g},${b},0.2)`;

        if (info.image_url) {
          const img = document.createElement('img');
          img.src = info.image_url; img.alt = entry.team; img.loading = 'lazy';
          logoArea.appendChild(img);
        } else {
          const fb = document.createElement('div');
          fb.className = 'logo-fallback'; fb.textContent = entry.team;
          logoArea.appendChild(fb);
        }
        card.appendChild(logoArea);

        // 選手名部分
        const nameArea = document.createElement('div');
        nameArea.className = 'player-card-name';
        nameArea.style.background = `rgba(${r},${g},${b},0.08)`;

        const dot = document.createElement('div');
        dot.className = 'player-name-dot';
        dot.style.background = color;
        dot.style.boxShadow = neonGlow(color, 0.8);

        const pName = (entry.player || '').trim();
        const isUndecided = !pName || pName === '未定' || pName === '-';
        const nameEl = document.createElement('div');
        nameEl.className = 'player-name-text' + (isUndecided ? ' undecided' : '');
        nameEl.textContent = isUndecided ? '未定' : pName;

        nameArea.appendChild(dot);
        nameArea.appendChild(nameEl);
        card.appendChild(nameArea);

        grid.appendChild(card);
      });

      block.appendChild(grid);

      // ウォーターマーク
      const kanji = document.createElement('div');
      kanji.className = 'card-kanji';
      kanji.textContent = COURT_KANJI[n] || '';
      block.appendChild(kanji);

      container.appendChild(block);
    });
  }

  // ─────────────────────────────────────────────────
  // 初期化
  // ─────────────────────────────────────────────────
  window.addEventListener('pageshow', () => document.body.classList.add('visible'));
  loadData();
  </script>
</body>
</html>
