<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RESULTS - 黎明戦</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Noto+Serif+JP:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #06020e;
      --gold: rgba(200,168,75,1);
      --gold-dim: rgba(200,168,75,0.35);
      --gold-faint: rgba(200,168,75,0.08);
      --text: #e8e0d0;
      --text-dim: rgba(232,224,208,0.5);
      --dawn: #e8713a;
      --dawn-dim: rgba(232,113,58,0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Serif JP', serif;
      min-height: 100vh; overflow-x: hidden;
      opacity: 0; transition: opacity 0.5s ease;
    }
    body.visible { opacity: 1; }
    body::before {
      content: ''; position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 50% 100%, rgba(232,113,58,0.07) 0%, transparent 70%),
        radial-gradient(ellipse 80% 50% at 50% 110%, rgba(200,168,75,0.04) 0%, transparent 60%);
      pointer-events: none; z-index: 0;
    }

    /* ── ヘッダ ── */
    header {
      position: fixed; top: 0; left: 0; right: 0; height: 56px;
      display: flex; align-items: center; padding: 0 24px;
      background: rgba(6,2,14,0.88); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--gold-dim); z-index: 100; gap: 16px;
    }
    .back-btn {
      color: var(--gold); text-decoration: none;
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px; letter-spacing: 0.1em; opacity: 0.8; transition: opacity 0.2s;
    }
    .back-btn:hover { opacity: 1; }
    .back-btn::before { content: '← '; }
    .header-logo { height: 28px; margin-left: auto; opacity: 0.9; }

    /* ── メイン ── */
    main {
      position: relative; z-index: 1;
      padding: 72px 24px 80px;
      max-width: 1100px; margin: 0 auto;
    }

    /* ── ページタイトル ── */
    .page-title { text-align: center; padding: 16px 0 20px; }
    .page-title h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(26px,4vw,44px); font-weight: 300;
      letter-spacing: 0.3em; color: var(--gold);
      text-shadow: 0 0 40px rgba(200,168,75,0.3);
    }
    .page-title .subtitle {
      font-size: 10px; letter-spacing: 0.35em; color: var(--text-dim); margin-top: 6px;
    }

    /* ── タブ ── */
    .tabs {
      display: flex; justify-content: center; gap: 0; margin-bottom: 32px;
    }
    .tab-btn {
      padding: 10px 28px; background: none;
      border: 1px solid var(--gold-dim); color: var(--text-dim);
      font-family: 'Noto Serif JP', serif; font-size: 12px;
      letter-spacing: 0.15em; cursor: pointer; transition: all 0.25s;
    }
    .tab-btn:first-child { border-radius: 2px 0 0 2px; }
    .tab-btn:last-child  { border-radius: 0 2px 2px 0; border-left: none; }
    .tab-btn:not(:first-child):not(:last-child) { border-left: none; }
    .tab-btn.active {
      background: rgba(200,168,75,0.12); color: var(--gold);
      border-color: var(--gold); box-shadow: 0 0 12px rgba(200,168,75,0.15);
    }

    /* ── パネル ── */
    .panel { display: none; }
    .panel.active { display: block; animation: fadeUp 0.35s ease; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ────────────────────────────────
       共通：セクションタイトル
    ──────────────────────────────── */
    .section-title {
      display: flex; align-items: center; gap: 16px;
      margin-bottom: 24px;
    }
    .section-title h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px; font-weight: 400; letter-spacing: 0.2em; color: var(--gold);
    }
    .section-title::after {
      content: ''; flex: 1; height: 1px;
      background: linear-gradient(90deg, var(--gold-dim), transparent);
    }

    /* ────────────────────────────────
       ① 前回の結果パネル
       recent_result.json: id,position,team,player,cardname,rank,score
       卓ごとにグループ化して表示
    ──────────────────────────────── */
    #panel-recent .result-courts {
      display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
    }

    .result-court {
      border: 1px solid var(--gold-dim); border-radius: 4px;
      overflow: hidden; animation: fadeUp 0.4s ease both;
    }
    .result-court-header {
      display: flex; align-items: center; justify-content: center;
      padding: 8px 14px;
      background: rgba(200,168,75,0.06);
      border-bottom: 1px solid var(--gold-faint);
      font-family: 'Cormorant Garamond', serif;
      font-size: 12px; letter-spacing: 0.3em; color: var(--gold-dim);
    }

    .result-row {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 16px;
      border-bottom: 1px solid rgba(200,168,75,0.06);
      transition: background 0.2s;
    }
    .result-row:last-child { border-bottom: none; }
    .result-row:hover { background: rgba(200,168,75,0.04); }

    /* 着順バッジ */
    .rank-badge {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Cormorant Garamond', serif; font-size: 14px; font-weight: 600;
      flex-shrink: 0;
    }
    .rank-1 { background: rgba(200,168,75,0.2); border: 1px solid var(--gold); color: var(--gold); box-shadow: 0 0 10px rgba(200,168,75,0.4); }
    .rank-2 { background: rgba(180,180,180,0.12); border: 1px solid rgba(180,180,180,0.5); color: #c8c8c8; }
    .rank-3 { background: rgba(180,120,60,0.15); border: 1px solid rgba(180,120,60,0.5); color: #c47840; }
    .rank-4 { background: rgba(100,100,120,0.12); border: 1px solid rgba(100,100,120,0.4); color: var(--text-dim); }

    .result-team-logo {
      width: 28px; height: 28px; border-radius: 50%;
      border: 1px solid var(--gold-dim);
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      background: rgba(200,168,75,0.06); flex-shrink: 0;
    }
    .result-team-logo img { width: 100%; height: 100%; object-fit: cover; }
    .result-team-logo span { font-size: 10px; color: var(--gold-dim); }

    .result-info { flex: 1; min-width: 0; }
    .result-player { font-size: 13px; letter-spacing: 0.04em; color: var(--text); }
    .result-team   { font-size: 10px; letter-spacing: 0.06em; color: var(--text-dim); margin-top: 2px; }

    .result-score {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px; font-weight: 400; letter-spacing: 0.05em;
      flex-shrink: 0; min-width: 56px; text-align: right;
    }
    .result-score.positive { color: var(--gold); }
    .result-score.negative { color: #e06060; }
    .result-score.zero     { color: var(--text-dim); }

    /* ────────────────────────────────
       ② チーム順位表パネル（SVG）
    ──────────────────────────────── */
    #panel-ranking .ranking-wrap {
      display: flex; justify-content: center;
    }
    #ranking-svg-container {
      width: 100%; max-width: 800px;
    }

    /* ────────────────────────────────
       ③ 個人ランキングパネル（SVG）
    ──────────────────────────────── */
    #panel-personal .personal-wrap {
      display: flex; justify-content: center;
    }
    #personal-svg-container {
      width: 100%; max-width: 720px;
    }

    /* ── ローディング/エラー ── */
    .loading {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px; padding: 80px 0;
      color: var(--text-dim); font-size: 12px; letter-spacing: 0.2em;
    }
    .loading-ring {
      width: 32px; height: 32px;
      border: 1px solid var(--gold-dim); border-top-color: var(--gold);
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-msg {
      text-align: center; padding: 60px 0;
      color: var(--dawn); font-size: 12px; letter-spacing: 0.15em;
    }

    /* ── 下部装飾ライン ── */
    .bottom-line {
      position: fixed; bottom: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg,
        transparent 0%, var(--dawn-dim) 20%, var(--dawn) 50%,
        var(--dawn-dim) 80%, transparent 100%);
      z-index: 100;
    }

    @media (max-width: 640px) {
      #panel-recent .result-courts { grid-template-columns: 1fr; }
      .tab-btn { padding: 10px 14px; font-size: 11px; }
    }
  </style>
</head>
<body>

  <header>
    <a class="back-btn" href="index.html">トップへ</a>
    <img class="header-logo" src="assets/images/文字のみ.png" alt="黎明戦" onerror="this.style.display='none'">
  </header>

  <main>
    <div class="page-title">
      <h1>RESULTS</h1>
      <p class="subtitle">成績・順位表</p>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="panel-recent">前回の結果</button>
      <button class="tab-btn"        data-tab="panel-ranking">チーム順位</button>
      <button class="tab-btn"        data-tab="panel-personal">個人ランキング</button>
    </div>

    <!-- ① 前回の結果 -->
    <div id="panel-recent" class="panel active">
      <div class="section-title"><h2>前回の結果</h2></div>
      <div class="result-courts" id="recent-container">
        <div class="loading"><div class="loading-ring"></div><span>LOADING</span></div>
      </div>
    </div>

    <!-- ② チーム順位 -->
    <div id="panel-ranking" class="panel">
      <div class="section-title"><h2>チーム順位表</h2></div>
      <div class="ranking-wrap">
        <div id="ranking-svg-container">
          <div class="loading"><div class="loading-ring"></div><span>LOADING</span></div>
        </div>
      </div>
    </div>

    <!-- ③ 個人ランキング -->
    <div id="panel-personal" class="panel">
      <div class="section-title"><h2>個人ランキング</h2></div>
      <div class="personal-wrap">
        <div id="personal-svg-container">
          <div class="loading"><div class="loading-ring"></div><span>LOADING</span></div>
        </div>
      </div>
    </div>
  </main>

  <div class="bottom-line"></div>

  <script>
  // ────────────────────────────────────────────────
  // タブ
  // ────────────────────────────────────────────────
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.tab).classList.add('active');
    });
  });

  // ────────────────────────────────────────────────
  // ユーティリティ
  // ────────────────────────────────────────────────
  function normalizeColor(c) {
    if (!c) return '#888888';
    c = String(c).trim();
    return c.startsWith('#') ? c : '#' + c;
  }
  function hexToRgb(hex) {
    const h = hex.replace('#','');
    return { r: parseInt(h.slice(0,2),16), g: parseInt(h.slice(2,4),16), b: parseInt(h.slice(4,6),16) };
  }
  function neonBg(hex, a=0.15) {
    const {r,g,b} = hexToRgb(hex); return `rgba(${r},${g},${b},${a})`;
  }
  function neonGlow(hex, a=0.5) {
    const {r,g,b} = hexToRgb(hex); return `0 0 14px rgba(${r},${g},${b},${a})`;
  }
  function courtNum(pos) { return parseInt(pos.replace(/\D/g,'')) || 1; }

  // ────────────────────────────────────────────────
  // データ取得
  // ────────────────────────────────────────────────
  async function loadData() {
    try {
      const [recentRes, rankRes, personalRes, teamRes] = await Promise.all([
        fetch('data/recent_result.json'),
        fetch('data/ranking.json'),
        fetch('data/players_ranking.json'),
        fetch('data/team.json')
      ]);
      const recentData   = await recentRes.json();
      const rankingData  = await rankRes.json();
      const personalData = await personalRes.json();
      const teamData     = await teamRes.json();

      const teamMap = {};
      teamData.forEach(t => {
        teamMap[t.name] = { image_url: t.image_url || null, color: normalizeColor(t.color) };
      });

      renderRecent(recentData, teamMap);
      renderRankingSVG(rankingData, teamMap);
      renderPersonalSVG(personalData, teamMap);
    } catch(e) {
      console.error(e);
      ['recent-container','ranking-svg-container','personal-svg-container'].forEach(id => {
        document.getElementById(id).innerHTML = '<div class="error-msg">データの読み込みに失敗しました</div>';
      });
    }
  }

  // ────────────────────────────────────────────────
  // ① 前回の結果
  // ────────────────────────────────────────────────
  function renderRecent(data, teamMap) {
    const container = document.getElementById('recent-container');
    container.innerHTML = '';

    // 卓ごとにグループ化
    const courtMap = {};
    data.forEach(r => {
      const n = courtNum(r.position || '1');
      if (!courtMap[n]) courtMap[n] = { label: r.cardname || `${n}卓`, entries: [] };
      courtMap[n].entries.push(r);
    });

    Object.values(courtMap).forEach((court, ci) => {
      // 着順ソート
      const sorted = [...court.entries].sort((a,b) => (a.rank||99) - (b.rank||99));

      const courtEl = document.createElement('div');
      courtEl.className = 'result-court';
      courtEl.style.animationDelay = `${ci * 0.1}s`;

      const hdr = document.createElement('div');
      hdr.className = 'result-court-header';
      hdr.textContent = court.label;
      courtEl.appendChild(hdr);

      sorted.forEach(r => {
        const row = document.createElement('div');
        row.className = 'result-row';

        // 着順バッジ
        const badge = document.createElement('div');
        badge.className = `rank-badge rank-${r.rank || 4}`;
        badge.textContent = r.rank || '-';

        // チームロゴ
        const info = teamMap[r.team] || {};
        const logoEl = document.createElement('div');
        logoEl.className = 'result-team-logo';
        if (info.color) logoEl.style.borderColor = info.color;
        if (info.image_url) {
          const img = document.createElement('img');
          img.src = info.image_url; img.alt = r.team;
          logoEl.appendChild(img);
        } else {
          const sp = document.createElement('span');
          sp.textContent = (r.team || '?').charAt(0);
          logoEl.appendChild(sp);
        }

        // 情報
        const infoEl = document.createElement('div');
        infoEl.className = 'result-info';
        infoEl.innerHTML = `
          <div class="result-player">${r.player || '?'}</div>
          <div class="result-team">${r.team || ''}</div>
        `;

        // スコア
        const score = parseFloat(r.score) || 0;
        const scoreEl = document.createElement('div');
        scoreEl.className = 'result-score ' + (score > 0 ? 'positive' : score < 0 ? 'negative' : 'zero');
        scoreEl.textContent = (score > 0 ? '+' : '') + score.toLocaleString();

        row.appendChild(badge);
        row.appendChild(logoEl);
        row.appendChild(infoEl);
        row.appendChild(scoreEl);
        courtEl.appendChild(row);
      });

      container.appendChild(courtEl);
    });
  }

  // ────────────────────────────────────────────────
  // ② チーム順位表（SVG）
  // ranking.json: rank, team, score
  // ────────────────────────────────────────────────
  function renderRankingSVG(data, teamMap) {
    const container = document.getElementById('ranking-svg-container');
    const sorted = [...data].sort((a,b) => (a.rank||99) - (b.rank||99));

    const W = 800, HEADER = 100, ROW_H = 72, PAD = 32;
    const H = HEADER + ROW_H * sorted.length + PAD;

    // スコア最大値（バー幅計算用）
    const maxScore = Math.max(...sorted.map(d => Math.abs(parseFloat(d.score)||0)), 1);

    let svgRows = '';
    sorted.forEach((item, i) => {
      const info = teamMap[item.team] || {};
      const color = info.color || '#888888';
      const {r,g,b} = hexToRgb(color);
      const y = HEADER + i * ROW_H;
      const score = parseFloat(item.score) || 0;
      const barW = Math.max((Math.abs(score) / maxScore) * 320, 4);
      const isPos = score >= 0;

      // 着順メダル色
      const medalFill = i===0 ? '#c8a84b' : i===1 ? '#a0a0a8' : i===2 ? '#b07840' : '#404050';
      const medalStroke = i===0 ? 'rgba(200,168,75,0.8)' : i===1 ? 'rgba(160,160,168,0.6)' : i===2 ? '#906030' : '#303040';

      // 行背景（チームカラー帯）
      svgRows += `
        <!-- Row ${i} -->
        <rect x="0" y="${y}" width="${W}" height="${ROW_H}"
          fill="rgba(${r},${g},${b},0.04)" />
        <rect x="0" y="${y}" width="4" height="${ROW_H}"
          fill="rgba(${r},${g},${b},0.7)" rx="0"/>
        <line x1="0" y1="${y + ROW_H}" x2="${W}" y2="${y + ROW_H}"
          stroke="rgba(200,168,75,0.08)" stroke-width="1"/>

        <!-- 着順メダル -->
        <circle cx="44" cy="${y + ROW_H/2}" r="16"
          fill="${medalFill}" fill-opacity="0.18"
          stroke="${medalStroke}" stroke-width="1"/>
        <text x="44" y="${y + ROW_H/2 + 5}"
          font-family="Cormorant Garamond, serif" font-size="16" font-weight="600"
          fill="${medalFill}" text-anchor="middle">${item.rank || i+1}</text>

        <!-- チームロゴ（foreignObjectで画像、またはテキスト） -->
        ${info.image_url
          ? `<clipPath id="clip-r${i}"><circle cx="88" cy="${y + ROW_H/2}" r="22"/></clipPath>
             <image href="${info.image_url}" x="66" y="${y + ROW_H/2 - 22}"
               width="44" height="44" clip-path="url(#clip-r${i})" preserveAspectRatio="xMidYMid slice"/>
             <circle cx="88" cy="${y + ROW_H/2}" r="22" fill="none"
               stroke="rgba(${r},${g},${b},0.7)" stroke-width="1.5"/>`
          : `<circle cx="88" cy="${y + ROW_H/2}" r="22"
               fill="rgba(${r},${g},${b},0.12)" stroke="rgba(${r},${g},${b},0.5)" stroke-width="1.5"/>
             <text x="88" y="${y + ROW_H/2 + 7}" font-family="Cormorant Garamond, serif"
               font-size="18" fill="rgba(${r},${g},${b},0.8)" text-anchor="middle">
               ${(item.team||'?').charAt(0)}</text>`
        }

        <!-- チーム名 -->
        <text x="124" y="${y + ROW_H/2 - 4}"
          font-family="Noto Serif JP, serif" font-size="13" fill="#e8e0d0"
          dominant-baseline="auto">${item.team || ''}</text>

        <!-- スコアバー -->
        <rect x="124" y="${y + ROW_H/2 + 8}" width="${barW}" height="6" rx="3"
          fill="rgba(${r},${g},${b},0.55)"/>
        <rect x="124" y="${y + ROW_H/2 + 8}" width="${barW}" height="6" rx="3"
          fill="url(#bar-glow-${i})"/>

        <!-- スコア数値 -->
        <text x="${W - PAD}" y="${y + ROW_H/2 + 6}"
          font-family="Cormorant Garamond, serif" font-size="22" font-weight="400"
          fill="${isPos ? 'rgba(200,168,75,0.95)' : '#e06060'}"
          text-anchor="end">${(score > 0 ? '+' : '') + score.toLocaleString()}</text>
      `;

      // バー用グラデ定義は defs に後で追加
    });

    // defs: バーグラデ
    let defs = '<defs>';
    sorted.forEach((item, i) => {
      const info = teamMap[item.team] || {};
      const color = info.color || '#888888';
      const {r,g,b} = hexToRgb(color);
      defs += `
        <linearGradient id="bar-glow-${i}" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="rgba(${r},${g},${b},0.9)"/>
          <stop offset="100%" stop-color="rgba(${r},${g},${b},0.1)"/>
        </linearGradient>
      `;
    });
    defs += '</defs>';

    // ヘッダ
    const headerSVG = `
      <!-- ヘッダ枠 -->
      <rect x="0" y="0" width="${W}" height="${HEADER}" fill="rgba(200,168,75,0.04)"/>
      <rect x="0" y="${HEADER - 1}" width="${W}" height="1" fill="rgba(200,168,75,0.25)"/>

      <!-- タイトル装飾ライン -->
      <line x1="32" y1="50" x2="${W - 32}" y2="50" stroke="rgba(200,168,75,0.15)" stroke-width="1"/>

      <!-- ロゴ画像（あれば） -->
      <image href="assets/images/文字のみ.png" x="${W/2 - 60}" y="12"
        width="120" height="36" preserveAspectRatio="xMidYMid meet"
        opacity="0.7"/>

      <!-- TEAM RANKING テキスト -->
      <text x="${W/2}" y="78"
        font-family="Cormorant Garamond, serif" font-size="12" font-weight="300"
        fill="rgba(200,168,75,0.5)" text-anchor="middle" letter-spacing="6">
        TEAM RANKING</text>

      <!-- コーナーデコ -->
      <polyline points="0,0 16,0 16,2 2,2 2,16 0,16" fill="rgba(200,168,75,0.3)"/>
      <polyline points="${W},0 ${W-16},0 ${W-16},2 ${W-2},2 ${W-2},16 ${W},16" fill="rgba(200,168,75,0.3)"/>
      <polyline points="0,${H} 16,${H} 16,${H-2} 2,${H-2} 2,${H-16} 0,${H-16}" fill="rgba(200,168,75,0.3)"/>
      <polyline points="${W},${H} ${W-16},${H} ${W-16},${H-2} ${W-2},${H-2} ${W-2},${H-16} ${W},${H-16}" fill="rgba(200,168,75,0.3)"/>
    `;

    // 外枠
    const borderSVG = `
      <rect x="0.5" y="0.5" width="${W-1}" height="${H-1}" rx="3"
        fill="none" stroke="rgba(200,168,75,0.3)" stroke-width="1"/>
    `;

    const svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"
      style="width:100%;height:auto;display:block;">
      ${defs}
      <!-- 背景 -->
      <rect width="${W}" height="${H}" fill="#06020e" rx="3"/>
      <!-- 微細ノイズ風グリッド -->
      ${Array.from({length: Math.ceil(H/40)}, (_,i) =>
        `<line x1="0" y1="${i*40}" x2="${W}" y2="${i*40}" stroke="rgba(255,255,255,0.015)" stroke-width="1"/>`
      ).join('')}
      ${headerSVG}
      ${svgRows}
      ${borderSVG}
    </svg>`;

    container.innerHTML = svg;
  }

  // ────────────────────────────────────────────────
  // ③ 個人ランキング（SVG）
  // players_ranking.json: rank, name, score
  // ────────────────────────────────────────────────
  function renderPersonalSVG(data, teamMap) {
    const container = document.getElementById('personal-svg-container');
    const sorted = [...data].sort((a,b) => (a.rank||99) - (b.rank||99));

    const W = 720, HEADER = 90, ROW_H = 58, PAD = 24;
    const H = HEADER + ROW_H * sorted.length + PAD;

    const maxScore = Math.max(...sorted.map(d => Math.abs(parseFloat(d.score)||0)), 1);

    // TOP3 のハイライト色
    const TOP_COLORS = ['#c8a84b','#a0a0a8','#b07840'];
    const TOP_GLOW   = ['rgba(200,168,75,0.45)','rgba(160,160,168,0.3)','rgba(176,120,64,0.35)'];

    let svgRows = '';
    let defs = '<defs>';

    sorted.forEach((item, i) => {
      const y = HEADER + i * ROW_H;
      const score = parseFloat(item.score) || 0;
      const barW = Math.max((Math.abs(score) / maxScore) * 280, 4);
      const isTop3 = i < 3;
      const accent = isTop3 ? TOP_COLORS[i] : 'rgba(200,168,75,0.4)';
      const glowCol = isTop3 ? TOP_GLOW[i] : 'rgba(200,168,75,0.1)';

      defs += `
        <linearGradient id="pg-${i}" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="${accent}" stop-opacity="0.9"/>
          <stop offset="100%" stop-color="${accent}" stop-opacity="0.1"/>
        </linearGradient>
      `;

      // 行背景
      const rowBg = isTop3
        ? `rgba(200,168,75,0.04)`
        : `rgba(255,255,255,0.015)`;

      svgRows += `
        <!-- Row ${i}: ${item.name} -->
        <rect x="0" y="${y}" width="${W}" height="${ROW_H}" fill="${rowBg}"/>
        ${isTop3 ? `<rect x="0" y="${y}" width="3" height="${ROW_H}" fill="${accent}" opacity="0.8"/>` : ''}
        <line x1="0" y1="${y + ROW_H}" x2="${W}" y2="${y + ROW_H}"
          stroke="rgba(200,168,75,0.06)" stroke-width="1"/>

        <!-- 順位 -->
        ${isTop3
          ? `<circle cx="40" cy="${y + ROW_H/2}" r="18"
               fill="${accent}" fill-opacity="0.15"
               stroke="${accent}" stroke-width="1.5"/>
             <text x="40" y="${y + ROW_H/2 + 6}"
               font-family="Cormorant Garamond, serif" font-size="18" font-weight="600"
               fill="${accent}" text-anchor="middle">${item.rank}</text>`
          : `<text x="40" y="${y + ROW_H/2 + 5}"
               font-family="Cormorant Garamond, serif" font-size="15"
               fill="rgba(200,168,75,0.4)" text-anchor="middle">${item.rank}</text>`
        }

        <!-- 名前 -->
        <text x="72" y="${y + ROW_H/2 - 5}"
          font-family="Noto Serif JP, serif" font-size="${isTop3 ? 14 : 13}"
          fill="${isTop3 ? '#e8e0d0' : 'rgba(232,224,208,0.8)'}"
          dominant-baseline="auto">${item.name || ''}</text>

        <!-- スコアバー -->
        <rect x="72" y="${y + ROW_H/2 + 8}" width="${barW}" height="5" rx="2.5"
          fill="url(#pg-${i})"/>

        <!-- スコア数値 -->
        <text x="${W - 24}" y="${y + ROW_H/2 + 5}"
          font-family="Cormorant Garamond, serif" font-size="${isTop3 ? 20 : 17}" font-weight="400"
          fill="${score >= 0 ? accent : '#e06060'}"
          text-anchor="end">${(score > 0 ? '+' : '') + score.toLocaleString()}</text>
      `;
    });

    defs += '</defs>';

    const headerSVG = `
      <rect x="0" y="0" width="${W}" height="${HEADER}" fill="rgba(200,168,75,0.03)"/>
      <rect x="0" y="${HEADER-1}" width="${W}" height="1" fill="rgba(200,168,75,0.2)"/>
      <image href="assets/images/文字のみ.png" x="${W/2 - 50}" y="10"
        width="100" height="30" preserveAspectRatio="xMidYMid meet" opacity="0.65"/>
      <text x="${W/2}" y="70"
        font-family="Cormorant Garamond, serif" font-size="11" font-weight="300"
        fill="rgba(200,168,75,0.45)" text-anchor="middle" letter-spacing="6">
        INDIVIDUAL RANKING</text>
      <polyline points="0,0 14,0 14,2 2,2 2,14 0,14" fill="rgba(200,168,75,0.3)"/>
      <polyline points="${W},0 ${W-14},0 ${W-14},2 ${W-2},2 ${W-2},14 ${W},14" fill="rgba(200,168,75,0.3)"/>
      <polyline points="0,${H} 14,${H} 14,${H-2} 2,${H-2} 2,${H-14} 0,${H-14}" fill="rgba(200,168,75,0.3)"/>
      <polyline points="${W},${H} ${W-14},${H} ${W-14},${H-2} ${W-2},${H-2} ${W-2},${H-14} ${W},${H-14}" fill="rgba(200,168,75,0.3)"/>
    `;

    const svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"
      style="width:100%;height:auto;display:block;">
      ${defs}
      <rect width="${W}" height="${H}" fill="#06020e" rx="3"/>
      ${Array.from({length: Math.ceil(H/36)}, (_,i) =>
        `<line x1="0" y1="${i*36}" x2="${W}" y2="${i*36}" stroke="rgba(255,255,255,0.012)" stroke-width="1"/>`
      ).join('')}
      ${headerSVG}
      ${svgRows}
      <rect x="0.5" y="0.5" width="${W-1}" height="${H-1}" rx="3"
        fill="none" stroke="rgba(200,168,75,0.25)" stroke-width="1"/>
    </svg>`;

    container.innerHTML = svg;
  }

  // ────────────────────────────────────────────────
  // 初期化
  // ────────────────────────────────────────────────
  window.addEventListener('pageshow', () => document.body.classList.add('visible'));
  loadData();
  </script>
</body>
</html>
