# ════════════════════════════════════════════════════════════
# og-capture.yml  ―  【Step3 自動トリガー対応】
#   3種類のog画像をPNG化して previews/ に保存する。
#     previews/result.png        … 前回の結果
#     previews/ranking.png       … チーム順位表
#     previews/match_teams.png   … 次節の対戦（チーム）
#     previews/match_players.png … 次節の組み合わせ（選手）
#
#   起動条件:
#     - data/ 配下のJSONがpushされたとき（成績更新で自動）
#     - 手動ボタン（テスト/リカバリ用に残す）
# ════════════════════════════════════════════════════════════

# ワークフローの表示名（ActionsタブのUIに出る）
name: OG画像キャプチャ（4枚）

# ── 同時実行の制御（後勝ち） ──
#   GASは複数JSONを連続pushするため、Actionsも連続起動する。
#   同じグループ名の実行は1本に絞り、新しい実行が来たら
#   実行中の古いものをキャンセルする（cancel-in-progress: true）。
#   → 最後のpush時点（全データが揃った状態）で1回だけ撮れる。
#   → 複数の git push がぶつかる競合も起きなくなる。
concurrency:
  group: og-capture          # このグループ内では同時に1本だけ
  cancel-in-progress: true   # 新しいのが来たら実行中をキャンセル（後勝ち）

# ── いつ動くか ──
on:
  # 手動実行ボタン（ActionsタブのRun workflow。テストやリカバリ用に常設）
  workflow_dispatch:

  # data/ 配下のJSONがpushされたら自動起動
  push:
    branches:
      - main          # main ブランチへのpushのみ対象
    paths:
      - 'data/**'     # ← data配下の変更だけに反応。
                      #    previews/ のPNGをActions自身がpushしても
                      #    ここに含まれないので再発火しない（無限ループ防止）

# ── 実行する作業のまとまり ──
jobs:
  capture:
    # 使い捨てLinux（最新のUbuntu）を使う
    runs-on: ubuntu-latest

    # このジョブにリポジトリへ書き込む権限を与える（PNGをcommitするため）
    permissions:
      contents: write

    steps:
      # ① リポジトリのファイルを使い捨てLinuxに持ってくる
      - name: リポジトリを取得
        uses: actions/checkout@v4

      # ② Node.js を入れる
      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ③ 日本語フォントを入れる（これが無いと文字が□豆腐になる）
      - name: 日本語フォントを導入
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      # ④ Playwright と Chromium を入れる
      #    --with-deps でChromeの動作に必要なライブラリも一緒に入る
      - name: Playwright を導入
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      # ⑤ og_*.html を配信する簡易HTTPサーバをバックグラウンドで起動
      #    fetch('data/...') を成立させるため file:// ではなく http:// で開く
      #    末尾の & でバックグラウンド実行、sleepでサーバ起動を少し待つ
      - name: 簡易サーバを起動
        run: |
          npx --yes http-server . -p 8080 -c-1 &
          sleep 3

      # ⑥ キャプチャ実行（4種類を順に撮る）
      #    capture.mjs は --url と --out で対象を切り替えられる作り。
      #    1枚失敗しても他が撮れるよう、各ステップは独立させている。
      - name: og_result をキャプチャ（前回の結果）
        run: node scripts/capture.mjs --url "http://localhost:8080/og_result.html" --out "previews/result.png"

      - name: og_ranking をキャプチャ（チーム順位表）
        run: node scripts/capture.mjs --url "http://localhost:8080/og_ranking.html" --out "previews/ranking.png"

      - name: match_teams をキャプチャ（次節の対戦・チーム）
        run: node scripts/capture.mjs --url "http://localhost:8080/match_teams.html" --out "previews/match_teams.png"

      - name: match_players をキャプチャ（次節の組み合わせ・選手）
        run: node scripts/capture.mjs --url "http://localhost:8080/match_players.html" --out "previews/match_players.png"

      # ⑦ できたPNGをリポジトリにcommit & push
      #    previews/ 配下をまとめて対象にする。
      #    concurrency で競合はほぼ防げるが、保険として
      #    push失敗時はリモート最新を取り込んで数回リトライする。
      - name: PNGをコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add previews/

          # 変更が無ければここで終了（commitもpushもしない）
          if git diff --cached --quiet; then
            echo "変更なし: コミットをスキップ"
            exit 0
          fi

          git commit -m "chore: og画像を更新（result/ranking/match_teams/match_players）"

          # push をリトライ付きで実行（最大5回）
          # rejected が出たら remote の最新を rebase で取り込んでから再push
          n=0
          until [ $n -ge 5 ]; do
            if git push; then
              echo "push 成功"
              exit 0
            fi
            n=$((n+1))
            echo "push 失敗（$n 回目）。最新を取り込んで再試行します…"
            git pull --rebase origin main
            sleep 3
          done

          echo "push が5回失敗しました"
          exit 1
