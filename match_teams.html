<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OG MATCH (teams) - 黎明戦 次節の組み合わせ・チーム</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Noto+Serif+JP:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #06020e;
      --gold: rgba(200,168,75,1);
      --gold-dim: rgba(200,168,75,0.35);
      --text: #e8e0d0;
      --text-dim: rgba(232,224,208,0.5);
      --dawn: #e8713a;
      --dawn-dim: rgba(232,113,58,0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: #000; width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Noto Serif JP', serif;
    }

    /* キャプチャ対象：1600×900 固定 */
    #capture {
      position: relative; width: 1600px; height: 900px;
      flex-shrink: 0; background: var(--bg); color: var(--text); overflow: hidden;
    }
    #capture::before {
      content: ''; position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 60% 45% at 50% 105%, rgba(232,113,58,0.10) 0%, transparent 65%),
        radial-gradient(ellipse 85% 55% at 50% 115%, rgba(200,168,75,0.05) 0%, transparent 60%);
      pointer-events: none; z-index: 0;
    }
    #capture.preview { transform-origin: center center; }

    /* 上部ヘッダ */
    .og-header {
      position: relative; z-index: 2;
      display: flex; align-items: flex-end; justify-content: space-between;
      padding: 40px 56px 22px;
    }
    .og-title-block { display: flex; flex-direction: column; gap: 6px; }
    .og-eyebrow {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px; letter-spacing: 0.5em; color: rgba(200,168,75,0.7); text-transform: uppercase;
    }
    .og-title {
      font-family: 'Noto Serif JP', serif; font-weight: 600;
      font-size: 46px; letter-spacing: 0.12em; color: var(--text); line-height: 1;
    }
    .og-meta { text-align: right; display: flex; flex-direction: column; gap: 4px; }
    .og-section {
      font-family: 'Noto Serif JP', serif;
      font-size: 38px; font-weight: 600; letter-spacing: 0.1em; color: var(--gold); line-height: 1;
    }
    .og-section-sub { font-family: 'Noto Serif JP', serif; font-size: 15px; font-weight: 400; letter-spacing: 0.2em; color: var(--text-dim); }

    .og-divider {
      position: relative; z-index: 2; height: 1px; margin: 0 56px;
      background: linear-gradient(90deg, transparent, var(--gold-dim) 15%, var(--gold-dim) 85%, transparent);
    }

    /* 卓を横並び */
    .og-courts {
      position: relative; z-index: 2;
      display: flex; flex-direction: row; gap: 28px;
      padding: 26px 56px 0; justify-content: center; align-items: flex-start;
    }
    .court-block { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
    .court-header {
      display: flex; align-items: center; justify-content: center; gap: 14px;
      padding: 8px 12px; border: 1px solid var(--gold-dim); border-radius: 2px;
      background: rgba(200,168,75,0.06);
    }
    .court-header::before, .court-header::after {
      content: ''; width: 70px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
    }
    .court-header-text {
      font-family: 'Noto Serif JP', serif; font-size: 22px;
      letter-spacing: 0.4em; color: var(--gold); padding-left: 0.4em; white-space: nowrap;
    }
    .court-board {
      display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
      gap: 4px; height: 560px;
    }

    /* チームカード（match.htmlのteam-card方式：ロゴ全面） */
    .team-card {
      position: relative; overflow: hidden;
      border: 1px solid var(--gold-dim); background: #000;
      display: flex; align-items: center; justify-content: center;
    }
    /* チームカラー帯（上辺） */
    .tc-colorbar { position: absolute; top: 0; left: 0; right: 0; height: 3px; z-index: 3; }
    /* ロゴ画像：カードいっぱいに */
    .tc-logo { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    .tc-logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .tc-logo .logo-text {
      font-family: 'Noto Serif JP', serif; font-size: 30px;
      color: var(--gold-dim); text-align: center; padding: 16px;
      letter-spacing: 0.05em; line-height: 1.4;
    }
    /* チーム名（下部に控えめ表示） */
    .tc-name {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 4;
      padding: 12px 18px;
      font-family: 'Noto Serif JP', serif; font-size: 22px; letter-spacing: 0.08em;
      color: var(--text);
      background: linear-gradient(to top, rgba(0,0,0,0.78) 0%, rgba(0,0,0,0.35) 60%, transparent 100%);
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
    }
    /* コーナーデコ */
    .team-card::before, .team-card::after {
      content: ''; position: absolute; width: 12px; height: 12px;
      border-color: var(--gold-dim); border-style: solid; z-index: 5; pointer-events: none;
    }
    .team-card::before { top: 8px; left: 8px; border-width: 1px 0 0 1px; }
    .team-card::after  { bottom: 8px; right: 8px; border-width: 0 1px 1px 0; }

    .og-footer {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
      display: flex; align-items: center; justify-content: space-between; padding: 16px 56px 20px;
    }
    .og-footer-left { font-family: 'Cormorant Garamond', serif; font-size: 16px; letter-spacing: 0.3em; color: rgba(200,168,75,0.6); }
    .og-footer-right { font-size: 13px; letter-spacing: 0.2em; color: var(--text-dim); }
    .og-bottom-line {
      position: absolute; bottom: 0; left: 0; right: 0; height: 3px; z-index: 3;
      background: linear-gradient(90deg, transparent 0%, var(--dawn-dim) 20%, var(--dawn) 50%, var(--dawn-dim) 80%, transparent 100%);
    }
    .og-error {
      position: absolute; inset: 0; z-index: 10;
      display: flex; align-items: center; justify-content: center;
      color: var(--dawn); font-size: 22px; letter-spacing: 0.15em;
    }
  </style>
</head>
<body>
  <div id="capture">
    <div class="og-header">
      <div class="og-title-block">
        <div class="og-eyebrow">NEXT MATCH</div>
        <div class="og-title">次節の対戦</div>
      </div>
      <div class="og-meta">
        <div class="og-section" id="og-section">―</div>
        <div class="og-section-sub" id="og-date">―</div>
      </div>
    </div>
    <div class="og-divider"></div>
    <div class="og-courts" id="og-courts"></div>
    <div class="og-footer">
      <div class="og-footer-left">REIMEI-SEN</div>
      <div class="og-footer-right">黎明戦</div>
    </div>
    <div class="og-bottom-line"></div>
  </div>

  <script>
  const params = new URLSearchParams(location.search);
  const BASE = params.get('base') || 'data';

  function normalizeColor(c) {
    if (!c) return '#888888';
    c = String(c).trim();
    return c.startsWith('#') ? c : '#' + c;
  }
  function hexToRgb(hex) {
    const h = hex.replace('#','');
    return { r: parseInt(h.slice(0,2),16), g: parseInt(h.slice(2,4),16), b: parseInt(h.slice(4,6),16) };
  }
  function courtNum(pos) { return parseInt(String(pos).replace(/\D/g,'')) || 1; }
  function posDir(pos) { return String(pos).replace(/\d/g,''); }

  // ── schedule から次節を解決（JST基準） ──
  // タイムゾーンの罠を避けるため、日付は「JSTでのYYYY-MM-DD文字列」で扱い、
  // 文字列の辞書順比較で大小を判定する（YYYY-MM-DDなら日付順と一致）。

  // JSTでの「今日」を YYYY-MM-DD で返す
  function todayJST() {
    // en-CA ロケールは YYYY-MM-DD 形式で返る
    return new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit'
    }).format(new Date());
  }

  // schedule の date を YYYY-MM-DD 文字列に正規化
  //   "2026-05-26"（GAS出力）や "5/26" などを許容
  function normalizeDateStr(str) {
    if (!str) return null;
    str = String(str).trim();
    // 既に YYYY-MM-DD
    const iso = str.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (iso) return `${iso[1]}-${iso[2]}-${iso[3]}`;
    // M/D 形式 → 年は「JSTの今日」を基準に推定（過ぎていれば翌年）
    const parts = str.split('/').map(Number);
    if (parts.length >= 2 && parts[0] && parts[1]) {
      const [m, d] = parts;
      const t = todayJST();                  // "YYYY-MM-DD"
      let year = Number(t.slice(0, 4));
      const curMonth = Number(t.slice(5, 7));
      if (m < curMonth) year++;              // 月が過ぎていれば翌年
      return `${year}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    }
    return null;
  }

  const WEEKDAYS = ['日','月','火','水','木','金','土'];
  // YYYY-MM-DD 文字列 → "MM月DD日（曜）"。曜日はJSTで計算
  function formatDateStr(ymd) {
    if (!ymd) return '―';
    const [y, m, d] = ymd.split('-').map(Number);
    // 曜日算出のみDateを使う。正午UTC基準にして日付ズレを防ぐ
    const wd = new Date(Date.UTC(y, m - 1, d, 12)).getUTCDay();
    return `${String(m).padStart(2,'0')}月${String(d).padStart(2,'0')}日（${WEEKDAYS[wd]}）`;
  }

  function findNextSchedule(scheduleData) {
    const today = todayJST();  // "YYYY-MM-DD"
    const upcoming = scheduleData
      .map(row => ({ ...row, _ymd: normalizeDateStr(row.date) }))
      .filter(row => row._ymd && row._ymd >= today)   // 文字列比較で「今日以降」
      .sort((a, b) => (a._ymd < b._ymd ? -1 : a._ymd > b._ymd ? 1 : 0));
    return upcoming[0] || null;
  }

  function fitPreview() {
    const cap = document.getElementById('capture');
    const margin = 24;
    const scale = Math.min((window.innerWidth-margin)/1600, (window.innerHeight-margin)/900, 1);
    if (scale < 1) { cap.classList.add('preview'); cap.style.transform = `scale(${scale})`; }
    else { cap.classList.remove('preview'); cap.style.transform = 'none'; }
  }
  window.addEventListener('resize', fitPreview);

  function buildCourtHeader(label) {
    const header = document.createElement('div');
    header.className = 'court-header';
    const text = document.createElement('div');
    text.className = 'court-header-text';
    text.textContent = label || '';
    header.appendChild(text);
    return header;
  }

  // チーム単位カード（match.htmlのbuildTeamCard相当：ロゴ全面）
  function buildTeamCard(entry, teamMap) {
    const info  = entry ? (teamMap[entry.team] || {}) : {};
    const color = info.color || '#444444';
    const {r,g,b} = hexToRgb(color);

    const card = document.createElement('div');
    card.className = 'team-card';
    if (!entry) {
      card.innerHTML = '<div style="color:var(--text-dim);font-size:16px;letter-spacing:.2em;padding:16px">―</div>';
      return card;
    }

    // カラーバー（上辺）
    const bar = document.createElement('div');
    bar.className = 'tc-colorbar';
    bar.style.background = `linear-gradient(90deg, rgba(${r},${g},${b},0.95), rgba(${r},${g},${b},0.2))`;
    card.appendChild(bar);

    // ロゴ全面（無ければチーム名テキスト）
    const logoWrap = document.createElement('div');
    logoWrap.className = 'tc-logo';
    if (info.image_url) {
      const img = document.createElement('img');
      img.src = info.image_url; img.alt = entry.team;
      logoWrap.appendChild(img);
    } else {
      const fb = document.createElement('div');
      fb.className = 'logo-text'; fb.textContent = entry.team;
      logoWrap.appendChild(fb);
    }
    card.appendChild(logoWrap);

    // チーム名（下部に控えめ表示）。ロゴが無い場合は上のテキストと重複するので出さない
    if (info.image_url) {
      const name = document.createElement('div');
      name.className = 'tc-name';
      name.textContent = entry.team || '';
      card.appendChild(name);
    }

    return card;
  }

  function render(cards, teamMap) {
    const courts = document.getElementById('og-courts');
    courts.innerHTML = '';
    const ORDER = ['upleft','upright','bottomleft','bottomright'];

    const courtMap = {};
    cards.forEach(c => {
      const n = courtNum(c.position);
      if (!courtMap[n]) courtMap[n] = { label: c.cardname || `${n}卓`, entries: [] };
      courtMap[n].entries.push(c);
    });

    Object.values(courtMap).forEach(court => {
      const sortedByPos = ORDER
        .map(dir => court.entries.find(e => posDir(e.position||'') === dir))
        .filter(Boolean);
      court.entries.forEach(e => { if (!sortedByPos.includes(e)) sortedByPos.push(e); });

      const block = document.createElement('div');
      block.className = 'court-block';
      block.appendChild(buildCourtHeader(court.label));
      const board = document.createElement('div');
      board.className = 'court-board';
      for (let i=0;i<4;i++) board.appendChild(buildTeamCard(sortedByPos[i]||null, teamMap));
      block.appendChild(board);
      courts.appendChild(block);
    });
  }

  function waitForImages() {
    const imgs = Array.from(document.querySelectorAll('#capture img'));
    return Promise.all(imgs.map(img => {
      if (img.complete && img.naturalWidth > 0) return Promise.resolve();
      return new Promise(res => {
        img.addEventListener('load', res, { once:true });
        img.addEventListener('error', res, { once:true });
      });
    }));
  }
  function markReady(){ window.__OG_READY__ = true; }
  function markError(msg){
    const cap = document.getElementById('capture');
    const el = document.createElement('div'); el.className='og-error';
    el.textContent = msg || 'データの読み込みに失敗しました';
    cap.appendChild(el);
    window.__OG_ERROR__ = msg || 'error'; window.__OG_READY__ = true;
  }

  (async function init(){
    fitPreview();
    try {
      const [cardRes, teamRes, schedRes] = await Promise.all([
        fetch(`${BASE}/next_card.json`),
        fetch(`${BASE}/team.json`),
        fetch(`${BASE}/schedule.json`)
      ]);
      if (!cardRes.ok) throw new Error('next_card.json fetch failed: ' + cardRes.status);
      if (!teamRes.ok) throw new Error('team.json fetch failed: ' + teamRes.status);

      const cards = await cardRes.json();
      const teams = await teamRes.json();
      let schedule = [];
      if (schedRes.ok) { try { schedule = await schedRes.json(); } catch(_){} }

      const teamMap = {};
      teams.forEach(t => { teamMap[t.name] = { image_url: t.image_url || null, color: normalizeColor(t.color) }; });

      render(cards, teamMap);

      // メタ情報：次節（scheduleがあれば）。無ければcardnameから推定
      const nextSched = findNextSchedule(schedule);
      if (nextSched) {
        document.getElementById('og-section').textContent = nextSched.section || '';
        document.getElementById('og-date').textContent    = formatDateStr(nextSched._ymd);
      } else {
        const first = cards[0] || {};
        document.getElementById('og-section').textContent = (first.cardname || '').replace(/\s.*$/, '');
        document.getElementById('og-date').textContent    = first.date || '';
      }

      fitPreview();
      await (document.fonts ? document.fonts.ready : Promise.resolve());
      await waitForImages();
      requestAnimationFrame(() => requestAnimationFrame(markReady));
    } catch(e) {
      console.error(e);
      markError(String(e.message || e));
    }
  })();
  </script>
</body>
</html>
